version: 1
name: django-web-platform
vcs: github
stages:
  - id: test
    kind: test
    timeout_minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django system checks
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-value
          DJANGO_DEBUG: 'False'
          DJANGO_ALLOWED_HOSTS: '*'
        run: python manage.py check
      - name: Run tests
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-value
          DJANGO_DEBUG: 'False'
          DJANGO_ALLOWED_HOSTS: '*'
        run: python manage.py test --verbosity 2
  - id: provision
    kind: provision
    needs:
      - test
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: 'false'
      - name: Terraform init
        run: |
          cd infra
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
      - name: Terraform apply
        run: |
          cd infra
          terraform apply -auto-approve -input=false
  - id: configure
    kind: configure
    needs:
      - provision
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: 'false'
      - name: Read instance address
        id: infra
        run: |
          cd infra
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          echo "ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
      - name: Install Ansible
        run: pipx install ansible-core
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Add host key
        run: ssh-keyscan -H "${{ steps.infra.outputs.ip }}" >> ~/.ssh/known_hosts
      - name: Configure server
        run: |
          ansible-playbook -i "${{ steps.infra.outputs.ip }}," -u "$SSH_USER" \
            --private-key ~/.ssh/deploy_key \
            -e "django_secret_key=$DJANGO_SECRET_KEY" \
            ansible/playbook.yml
  - id: verify
    kind: verify
    needs:
      - configure
    timeout_minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: 'false'
      - name: Health check
        run: |
          cd infra
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          IP=$(terraform output -raw public_ip)
          curl --fail --retry 12 --retry-delay 15 --retry-all-errors "http://$IP/health"
          curl --fail --silent --output /dev/null --retry 6 --retry-delay 10 --retry-all-errors "http://$IP/"
rollback:
  strategy: rerun
